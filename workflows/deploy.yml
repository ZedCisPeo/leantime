name: Deploy to o2switch

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # permet de lancer manuellement

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, zip, curl

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies and build assets
        run: |
          npm install
          npm run production

      - name: Remove dev/test files before deploy
        run: |
          rm -rf tests
          rm -rf .github
          rm -rf .git
          rm -rf node_modules
          rm -rf .idea
          rm -rf .dev
          rm -f package-lock.json composer.lock

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /leantime.kerozine.fr/    # adapte selon ton arborescence o2switch
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
